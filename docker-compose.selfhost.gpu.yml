# Managed compose template for installer-based Zukan self-hosting with NVIDIA GPU support.

services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://zukan:${POSTGRES_PASSWORD}@db:5432/zukan
      SECRET_KEY: ${SECRET_KEY}
      AUTH_MODE: ${AUTH_MODE:-local}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      SINGLE_USER_OWNER_ID: ${SINGLE_USER_OWNER_ID:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CALLBACK_URL: ${OIDC_CALLBACK_URL:-}
      OIDC_ALLOWED_SUBJECT: ${OIDC_ALLOWED_SUBJECT:-}
      LOG_LEVEL: INFO
      COBALT_API_URL: ${COBALT_API_URL:-}
      COBALT_API_KEY: ${COBALT_API_KEY:-}
    volumes:
      - storage_data:/backend/storage
      - ${ZUKAN_LIBRARY_HOST_PATH:-nas_library}:/library
      - model_cache:/backend/model_cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zukan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zukan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zukan"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  nas_library:
  postgres_data:
  storage_data:
  model_cache:
