<button
  mat-mini-fab
  type="button"
  class="avatar-button"
  [matMenuTriggerFor]="profileMenu"
  aria-label="Profile"
>
  @if (avatarUrl(); as url) {
    <img class="avatar-image" [src]="url" alt="" />
  } @else {
    <span>{{ avatarLetter() }}</span>
  }
</button>

<mat-menu #profileMenu="matMenu" xPosition="before" panelClass="zukan-profile-menu">
  <div class="profile-panel" (click)="$event.stopPropagation()">
    <div class="profile-header">
      <button mat-fab type="button" class="avatar-button" disabled aria-label="User avatar">
        @if (avatarUrl(); as url) {
          <img class="avatar-image" [src]="url" alt="" />
        } @else {
          <span>{{ avatarLetter() }}</span>
        }
      </button>
      <div class="profile-copy">
        <div>{{ user()?.username }}</div>
        <div>{{ user()?.email ?? '' }}</div>
      </div>
    </div>

    <div class="profile-actions">
      <button mat-stroked-button type="button" (click)="openSettings()">
        <mat-icon>settings</mat-icon>
        <span>Owner preferences</span>
      </button>

      @if (authenticated()) {
        <a mat-stroked-button routerLink="/admin">
          <mat-icon>build</mat-icon>
          <span>Administration</span>
        </a>
      }
    </div>

    <mat-divider></mat-divider>

    <button mat-button type="button" (click)="openContact()">
      <mat-icon>contact_mail</mat-icon>
      <span>Contact</span>
    </button>

    <button mat-button type="button" class="sign-out-button" (click)="signOut()">
      <mat-icon>logout</mat-icon>
      <span>Sign Out</span>
    </button>

    <a
      mat-button
      class="feedback-link"
      href="https://github.com/starsbit/Zukan/issues/new"
      target="_blank"
      rel="noreferrer"
    >
      Help &amp; Feedback
    </a>
  </div>
</mat-menu>
