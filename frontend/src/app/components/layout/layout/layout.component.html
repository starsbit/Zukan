<div class="layout-shell">
  <zukan-navbar [showMenuToggle]="isMobile()" (menuToggle)="toggleSidenav()"></zukan-navbar>

  <div class="layout-container" [class.layout-container--mobile-open]="isMobile() && sidenavOpened()">
    @if (isMobile() && sidenavOpened()) {
      <button
        type="button"
        class="layout-backdrop"
        aria-label="Close navigation menu"
        (click)="closeSidenav()">
      </button>
    }

    <aside
      class="layout-sidebar"
      [class.layout-sidebar--mobile]="isMobile()"
      [class.layout-sidebar--open]="sidenavOpened()"
      [attr.aria-hidden]="isMobile() && !sidenavOpened()">
      <zukan-sidebar></zukan-sidebar>
    </aside>

    <main class="layout-content">
      <ng-content></ng-content>
    </main>
  </div>

  <zukan-upload-status-island></zukan-upload-status-island>
  <zukan-update-status-island></zukan-update-status-island>
</div>
