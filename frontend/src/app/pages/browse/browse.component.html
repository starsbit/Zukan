<zukan-layout>
  <zukan-media-browser
    [showStories]="true"
    [storyParams]="storyParams()"
    [dayGroups]="galleryStore.groupedByDay()"
    [timeline]="galleryStore.timeline()"
    [loading]="galleryStore.loading()"
    [allowSelection]="false"
    [emptyStateTitle]="'No media yet'"
    [emptyStateMessage]="'Add files to your library to get started.'"
  >
  </zukan-media-browser>
</zukan-layout>
